name: Set up pinned Linux PowerShell
description: Supply PowerShell for portable classifier and gate jobs on Boat.
runs:
  using: composite
  steps:
    - name: Install PowerShell 7.6.9
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -s):$(uname -m)" = 'Linux:x86_64'
        tools="$RUNNER_TEMP/powershell-7.6.9"
        archive="$RUNNER_TEMP/powershell-7.6.9-linux-x64.tar.gz"
        mkdir -p "$tools"
        curl --fail --location --retry 3 \
          https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell-7.6.9-linux-x64.tar.gz \
          --output "$archive"
        echo "1da6d6d6035d651f20e70ddee7c4c15ac6ab8b9fb40ee92240d91263f28a884b  $archive" | sha256sum --check -
        tar -xzf "$archive" -C "$tools"
        chmod +x "$tools/pwsh"
        "$tools/pwsh" -NoLogo -NoProfile -Command 'if ($PSVersionTable.PSVersion.ToString() -ne "7.6.9") { exit 1 }; $PSVersionTable.PSVersion.ToString()'
        echo "$tools" >> "$GITHUB_PATH"
